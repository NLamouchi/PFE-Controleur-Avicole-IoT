# =============================================================================
# mosquitto.conf -- broker MQTT de la maquette du controleur avicole
# PFE Mohamed Nadim LAMOUCHI -- Polytech Intl / STE TAADIC
#
# Reference des directives : https://mosquitto.org/man/mosquitto-conf-5.html
#
# Fichier de configuration complet, destine a etre lance explicitement :
#     mosquitto -c mosquitto.conf -v
# Sous Debian / Ubuntu, le service utilise /etc/mosquitto/mosquitto.conf, qui
# inclut deja /etc/mosquitto/conf.d/ : y deposer une copie de ce fichier sous le
# nom avicole.conf, en retirant alors les directives persistence et log_dest,
# deja presentes dans le fichier livre par le paquet (log_dest se cumule).
#
# PERIMETRE DE SECURITE -- a lire avant toute mise en service
# Cette configuration convient a un reseau local d'exploitation ferme : le
# broker n'est joignable que depuis le reseau Wi-Fi de la ferme, aucune
# redirection de port n'est ouverte sur la box ou le routeur. Les echanges ne
# sont alors ni authentifies ni chiffres. Des que le broker doit etre joignable
# depuis l'exterieur, l'authentification par mot de passe ET le chiffrement TLS
# deviennent necessaires : voir la derniere section de ce fichier.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Ecouteur reseau
# -----------------------------------------------------------------------------
# Sans fichier de configuration, Mosquitto 2.x n'ecoute que sur la boucle locale
# (127.0.0.1) : l'ESP32 ne pourrait pas s'y connecter. Declarer un ecouteur ouvre
# le port sur le reseau.
#
# 1883 est le port MQTT sans chiffrement.
listener 1883

# Variante plus restrictive, recommandee des que le PC a plusieurs interfaces
# (Wi-Fi + Ethernet + VPN) : lier l'ecouteur a la seule adresse du reseau de
# l'exploitation. Remplacer l'adresse par l'IPv4 du PC (commande ipconfig sous
# Windows, ip a sous Linux) et commenter la ligne precedente.
# listener 1883 192.168.1.100

# Ecouteur WebSockets pour l'application web (dossier application_web) : un
# navigateur ne sait pas ouvrir une connexion TCP brute sur 1883, il passe par
# un WebSocket. Les deux ecouteurs partagent les memes sujets : l'ESP32 reste
# sur 1883, le telephone se connecte sur 9001. allow_anonymous (section 2)
# s'applique aux deux, puisque per_listener_settings vaut false par defaut.
listener 9001
protocol websockets

# -----------------------------------------------------------------------------
# 2. Authentification
# -----------------------------------------------------------------------------
# Depuis la version 2.0, allow_anonymous vaut false des qu'un ecouteur est
# declare. La maquette utilise des clients sans identifiants (ESP32 et
# Node-RED) : l'acces anonyme doit donc etre autorise explicitement.
#
# ATTENTION : avec cette ligne, tout appareil du reseau local peut publier sur
# n'importe quel sujet, donc commander les actionneurs. C'est acceptable sur un
# reseau prive et ferme, pas au-dela.
allow_anonymous true

# -----------------------------------------------------------------------------
# 3. Persistance
# -----------------------------------------------------------------------------
# Ecrit sur disque les messages retenus, les abonnements et les sessions : apres
# un redemarrage du broker ou une coupure de courant, l'application web
# retrouve aussitot les messages retenus : statut de l'ESP32 (en ligne / hors
# ligne) et dernier voyant sanitaire. L'etat de l'ESP32 n'est pas retenu : il
# revient a la publication suivante, au plus 2 s plus tard.
persistence true

# Repertoire de la base mosquitto.db. Le decommenter et l'adapter au systeme :
#   Debian / Ubuntu (service) : /var/lib/mosquitto/
#   Windows (lancement manuel) : repertoire d'installation de Mosquitto
# persistence_location /var/lib/mosquitto/

# Intervalle d'ecriture sur disque, en secondes (defaut : 1800).
autosave_interval 300

# -----------------------------------------------------------------------------
# 4. Journal
# -----------------------------------------------------------------------------
# Le journal sert a distinguer une panne de transport d'une panne de capteur :
# il date chaque connexion et chaque deconnexion de client.
#
# Lancement manuel en console : decommenter stdout.
# log_dest stdout
log_dest file /var/log/mosquitto/mosquitto.log

# error, warning et notice sont les niveaux par defaut ; information ajoute les
# connexions et deconnexions de clients, utiles au diagnostic de la liaison.
log_type error
log_type warning
log_type notice
log_type information

# Horodatage des lignes du journal.
log_timestamp true

# -----------------------------------------------------------------------------
# 5. Acces depuis l'exterieur -- a activer avant tout deploiement non local
# -----------------------------------------------------------------------------
# Les lignes ci-dessous ne sont pas actives sur la maquette. Elles decrivent la
# configuration minimale exigee des que le broker sort du reseau local.
#
# a) Authentification par identifiants. Creer le fichier de mots de passe :
#      mosquitto_passwd -c /etc/mosquitto/passwd esp32-avicole
#    puis renseigner le meme identifiant dans le firmware, dans le noeud broker
#    de Node-RED et dans l'application web (qui ne propose pas encore ce champ).
# allow_anonymous false
# password_file /etc/mosquitto/passwd
#
# b) Chiffrement TLS sur le port 8883, avec un certificat serveur. Sans TLS, les
#    identifiants ci-dessus circulent en clair sur le reseau. Le firmware devra
#    alors utiliser un client chiffre (WiFiClientSecure au lieu de WiFiClient).
# listener 8883
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/serveur.crt
# keyfile  /etc/mosquitto/certs/serveur.key
#
# b') Meme chiffrement pour l'application web : WebSocket chiffre (wss) sur un
#    port dedie, a la place de l'ecouteur 9001 ; l'application doit alors etre
#    servie en HTTPS (elle ouvre wss:// quand la page est en https://).
# listener 8081
# protocol websockets
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/serveur.crt
# keyfile  /etc/mosquitto/certs/serveur.key
#
# c) Limiter chaque controleur a son propre prefixe de sujets (un batiment ne
#    doit pas pouvoir commander un autre) au moyen d'une liste de controle
#    d'acces : voir la directive acl_file et la documentation du projet.
# acl_file /etc/mosquitto/aclfile
