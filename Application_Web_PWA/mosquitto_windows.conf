# =============================================================================
# mosquitto_windows.conf -- broker du poulailler, lancé en console sous Windows
#
#   "C:\Program Files\mosquitto\mosquitto.exe" -c "chemin\vers\Application_Web_PWA\mosquitto_windows.conf" -v
#
# Même contenu utile que node-red/mosquitto.conf du projet, mais journal dans la
# console : le chemin /var/log/mosquitto/ du fichier du projet n'existe pas sous
# Windows et empêcherait le démarrage.
#
# Réseau local fermé uniquement : accès anonyme, sans chiffrement.
# =============================================================================

# MQTT classique, pour l'ESP32 (et Node-RED)
listener 1883

# MQTT sur WebSockets, pour l'application web ouverte dans le navigateur du téléphone
listener 9001
protocol websockets

# Clients sans identifiants (s'applique aux deux écouteurs)
allow_anonymous true

# Messages retenus (statut de l'ESP32, voyant sanitaire) conservés sur disque, dans le
# dossier de lancement (mosquitto.db), pour survivre à un redémarrage du broker
persistence true
autosave_interval 300

# Journal dans la console, avec connexions et déconnexions des clients
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
